name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tests unitaires des hooks et de la CLI
        run: bash tests/unit/run.sh

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Valider le plugin et la marketplace
        run: claude plugin validate .
