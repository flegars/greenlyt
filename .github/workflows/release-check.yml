name: Release check

on:
  push:
    tags: ["v*"]

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag, manifests and CHANGELOG consistency
        run: |
          tag="${GITHUB_REF_NAME#v}"
          plugin="$(jq -r .version .claude-plugin/plugin.json)"
          market="$(jq -r '.plugins[] | select(.name == "greenlyt") | .version' .claude-plugin/marketplace.json)"
          echo "tag=$tag plugin.json=$plugin marketplace.json=$market"
          [ "$tag" = "$plugin" ] && [ "$tag" = "$market" ] || { echo "inconsistent versions" >&2; exit 1; }
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "section ## [$tag] missing from CHANGELOG" >&2; exit 1; }
